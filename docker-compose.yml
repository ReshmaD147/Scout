services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      # curl -f treats Ollama's root endpoint response as a failure
      # (non-2xx), even though the service is genuinely running fine —
      # confirmed via direct testing: Ollama's own logs showed clean,
      # successful startup ("Listening on [::]:11434") while Docker's
      # healthcheck still reported it as unhealthy. Using ollama's own
      # CLI to list models is a more reliable signal that the server
      # is actually ready to serve requests.
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    environment:
      APP_ENV: production
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      # retail.db is intentionally NOT mounted as a volume — it's a
      # single file (not a directory), and Docker named volumes only
      # mount directories cleanly. For this demo deployment, the
      # seeded database baked into the image is acceptable; it resets
      # on rebuild, which is a known, accepted tradeoff for now.
      - chroma_data:/app/backend/data/chroma
      - chroma_products_data:/app/backend/data/chroma_products
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  ollama_data:
  retail_db:
  chroma_data:
  chroma_products_data:
